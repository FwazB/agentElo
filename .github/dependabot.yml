version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/public
      - /scripts/public-kit
    schedule:
      interval: weekly
    # Keep routine dependency PRs and their branches disabled.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
